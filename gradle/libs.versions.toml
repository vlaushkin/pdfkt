[versions]
# Kotlin 2.3.x — the compiler generation AGP 8.13's KMP library plugin pairs with.
kotlin = "2.3.21"

# AGP 8.13 — supports the Kotlin 2.3.x embedded compiler classpath.
# compileSdk = 36 requires AGP 8.6+.
agp = "8.13.2"

junit = "5.11.3"
junit-platform = "1.11.3"

# The single non-stdlib runtime dependency of `:core` — the public Sink type
# on Document.writeTo(sink). Everything else, codecs included, is common
# Kotlin over the stdlib.
kotlinx-io = "0.9.0"

# Dokka for -javadoc.jar generation (a Maven Central requirement)
dokka = "2.0.0"

# JetBrains' binary-compatibility-validator — keeps the public ABI committed
binary-compatibility-validator = "0.16.3"

# ktlint Gradle plugin — Kotlin code style enforcement
ktlint = "12.1.2"

# Spotless — license header enforcement
spotless = "6.25.0"

[libraries]
# Production (commonMain)
kotlinx-io-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlinx-io" }

# Test dependencies (NOT in the production artifact)
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test" }
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# The KMP-first Android library plugin: one `androidLibrary { }` target inside
# the `kotlin { }` block, one androidMain source set, no debug/release variant
# split to carry through publishing.
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
binary-compatibility-validator = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "binary-compatibility-validator" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
